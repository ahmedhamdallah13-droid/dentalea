<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dentalea</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7d6a">
<link rel="icon" href="icon-192.png">
<style>
:root{--g:#0f7d6a;--bg:#f1f4f3;--line:#d5dcda;--tx:#18211f;--mut:#5d6b67}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:20px 16px 60px;max-width:900px;margin-inline:auto}
h1{font-size:34px;margin:6px 0 4px;letter-spacing:.5px}
.sub{color:var(--mut);margin:0 0 16px;font-size:15px}
button,input,select{font:inherit;color:inherit}
.btn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 10px;font-size:17px;cursor:pointer}
.btn.pri{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
.btn:active{opacity:.7}
.row{display:flex;gap:10px;margin-bottom:10px}.row>*{flex:1}
#search{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:17px;margin-bottom:10px;background:#fff}
#drv{display:block;width:100%;margin-bottom:6px;font-weight:700}
#status{font-size:14px;color:var(--g);margin:0 0 12px;min-height:20px}
.zoom{display:flex;align-items:center;gap:8px;margin:6px 0}
.zoom .btn{padding:6px 16px;flex:none}
.hint{color:var(--mut);font-size:13px;margin:4px 0 12px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:calc(14px*var(--z,1))}
th{background:#e6ecea;font-weight:600;position:relative;white-space:nowrap}
th,td{border:1px solid var(--line);padding:6px;text-align:start;overflow:hidden;vertical-align:middle}
.rs{position:absolute;inset-block:0;inset-inline-end:-3px;width:8px;cursor:col-resize;touch-action:none}
td input,td select{width:100%;border:1px solid transparent;background:transparent;padding:5px;border-radius:6px;font-size:inherit}
td input:focus,td select:focus{border-color:var(--g);outline:none;background:#fff}
tr.tot td{background:#e6ecea;font-weight:700}
.sub td{background:#f8fbfa}
.chip{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:6px;margin:1px;font-weight:700;background:#fff}
.x{background:none;border:0;font-size:20px;color:var(--mut);cursor:pointer}
.tg{background:none;border:0;cursor:pointer;font-size:16px;color:var(--g)}
.tb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;width:100%;text-align:start;min-height:34px}
.st-Completed{background:#dff3ec!important}
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-start;justify-content:center;padding:70px 8px;z-index:9;overflow:auto}
#modal.on{display:flex}
.box{background:#fff;border-radius:16px;padding:14px;width:100%;max-width:620px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 16px;cursor:pointer}
.seg .on{background:#dff3ec;color:var(--g);font-weight:700}
.chart{direction:ltr;margin:14px 0}
.half{display:flex;justify-content:center}
.q{display:flex;gap:3px;padding:6px 4px}
.q.r{border-inline-end:3px solid #000}
.up{border-bottom:3px solid #000}
.t{width:34px;height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:18px;font-weight:700;cursor:pointer;padding:0}
.t.on{background:var(--g);color:#fff;border-color:var(--g)}
.lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);direction:ltr}
.pl{display:inline-block;padding:0 4px;line-height:1.1}
.UR{border-bottom:2px solid;border-right:2px solid}.UL{border-bottom:2px solid;border-left:2px solid}
.LR{border-top:2px solid;border-right:2px solid}.LL{border-top:2px solid;border-left:2px solid}
</style>
</head>
<body>
<h1>Dentalea</h1>
<p class="sub">رقم السن بنظام Palmer — اضغط على خانة السن واختار من الرسمة.</p>

<button class="btn" id="drv">Google Drive ☁</button>
<p id="status"></p>
<input id="search" placeholder="بحث باسم الحالة">
<div class="row"><button class="btn" id="bImp">استيراد حالات</button><button class="btn" id="bSave">حفظ نسخة فيها الحالات</button></div>
<div class="row"><button class="btn" id="bXls">تنزيل Excel</button><button class="btn pri" id="bNew">+ حالة جديدة</button></div>
<div class="zoom">حجم الجدول <button class="btn" id="zm">−</button><b id="zv">100%</b><button class="btn" id="zp">+</button><button class="btn" id="zr">رجوع للأصل</button></div>
<p class="hint">· اسحب الخط اللي بين عناوين الأعمدة عشان توسّع أو تضيّق العمود. اضغط ▸ لعرض إجراءات كل سن.</p>

<div class="wrap"><table id="tbl"></table></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<div id="modal"><div class="box">
 <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
  <b>اختار سن أو أكتر</b>
  <div class="seg"><button id="mP" class="on">دائم 1–8</button><button id="mD">لبني A–E</button></div>
 </div>
 <div class="chart" id="chart"></div>
 <div class="row"><button class="btn" id="mDone">تم</button><button class="btn" id="mClr">مسح الكل</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
// ===== إعدادات =====
const CLIENT_ID = ''; // ضع هنا Google OAuth Client ID لتفعيل الحفظ على Drive
const FILE_NAME = 'Dentalea.json';
const PROCS = {
 'حشو عصب':['Access','C&C','Irrigation','Obturation','Completed'],
 'حشو تجميلي':['Planned','In progress','Completed'],
 'تلبيس':['Prep','Impression','Cementation','Completed'],
 'خلع':['Planned','Completed'],
 'تنظيف':['Planned','Completed'],
 'تبييض':['Planned','Completed'],
 'زرع':['Planned','Surgery','Healing','Completed']
};
const DEF = 'حشو عصب';
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const nowStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmt = s => { if(!s) return ''; const [d,t]=s.split('T'); const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y} ${t||''}`; };
const keyOf = t => t.q+t.n;
const lblOf = t => `${t.n} (${t.q})`;

let cases = JSON.parse(localStorage.getItem('dentalea')||'[]');
let open = new Set(), zoom = 1, colW = [30,190,170,150,60,90,36], pickId = null, sel = new Set(), mode = 'P';
const persist = () => localStorage.setItem('dentalea', JSON.stringify(cases));
const total = c => c.teeth.reduce((a,t)=>a+(+t.price||0),0);

// ===== الجدول =====
const HEAD = ['','اسم الحالة','تاريخ ووقت التسجيل','الأسنان','العدد','الإجمالي (ج.م)',''];
function render(){
 const q = $('#search').value.trim().toLowerCase();
 let h = '<colgroup>'+colW.map(w=>`<col style="width:${w}px">`).join('')+'</colgroup><tr>'+HEAD.map((t,i)=>`<th>${t}<span class="rs" data-i="${i}"></span></th>`).join('')+'</tr>';
 const list = cases.filter(c=>!q||c.name.toLowerCase().includes(q));
 for(const c of list){
  const o = open.has(c.id);
  h += `<tr data-id="${c.id}"><td><button class="tg" data-a="tg">${o?'▾':'▸'}</button></td>
   <td><input data-f="name" value="${esc(c.name)}" placeholder="اسم المريض"></td>
   <td><input type="datetime-local" step="1" data-f="dt" value="${esc(c.dt)}"></td>
   <td><button class="tb" data-a="pick">${c.teeth.map(t=>`<span class="chip"><span class="pl ${t.q}">${t.n}</span></span>`).join('')||'اختار الأسنان'}</button></td>
   <td data-n>${c.teeth.length}</td><td data-s>${total(c)}</td><td><button class="x" data-a="del">✕</button></td></tr>`;
  if(o) for(const t of c.teeth){
   h += `<tr class="sub" data-id="${c.id}" data-k="${keyOf(t)}"><td></td><td><span class="chip"><span class="pl ${t.q}">${t.n}</span></span> ${lblOf(t)}</td>
    <td><select data-f="proc">${Object.keys(PROCS).map(p=>`<option ${p===t.proc?'selected':''}>${p}</option>`).join('')}</select></td>
    <td colspan="2"><select data-f="stage" class="st-${t.stage}">${PROCS[t.proc].map(s=>`<option ${s===t.stage?'selected':''}>${s}</option>`).join('')}</select></td>
    <td><input type="number" min="0" data-f="price" value="${t.price||0}"></td><td></td></tr>`;
  }
 }
 const tc = list.reduce((a,c)=>a+c.teeth.length,0), ts = list.reduce((a,c)=>a+total(c),0);
 h += `<tr class="tot"><td colspan="4">الإجمالي (${list.length} حالة)</td><td id="tc">${tc}</td><td id="ts">${ts}</td><td></td></tr>`;
 $('#tbl').innerHTML = h;
 $('#tbl').style.setProperty('--z', zoom); $('#zv').textContent = Math.round(zoom*100)+'%';
}
function updTotals(){
 const q=$('#search').value.trim().toLowerCase(); const list=cases.filter(c=>!q||c.name.toLowerCase().includes(q));
 $('#tc').textContent=list.reduce((a,c)=>a+c.teeth.length,0); $('#ts').textContent=list.reduce((a,c)=>a+total(c),0);
 document.querySelectorAll('tr[data-id]:not(.sub)').forEach(r=>{const c=cases.find(x=>x.id==r.dataset.id); if(c) r.querySelector('[data-s]').textContent=total(c);});
}
const byId = id => cases.find(c=>c.id==id);

$('#tbl').addEventListener('input',e=>{
 const r=e.target.closest('tr'); if(!r||!e.target.dataset.f) return;
 const c=byId(r.dataset.id); const f=e.target.dataset.f;
 if(f==='name') c.name=e.target.value; else if(f==='dt') c.dt=e.target.value;
 else if(f==='price'){ c.teeth.find(t=>keyOf(t)===r.dataset.k).price=+e.target.value||0; updTotals(); }
 persist();
});
$('#tbl').addEventListener('change',e=>{
 const r=e.target.closest('tr'), f=e.target.dataset.f; if(!r||!['proc','stage'].includes(f)) return;
 const t=byId(r.dataset.id).teeth.find(t=>keyOf(t)===r.dataset.k);
 if(f==='proc'){ t.proc=e.target.value; t.stage=PROCS[t.proc][0]; } else t.stage=e.target.value;
 persist(); render();
});
$('#tbl').addEventListener('click',e=>{
 const b=e.target.closest('[data-a]'); if(!b) return; const id=b.closest('tr').dataset.id;
 if(b.dataset.a==='tg'){ open.has(+id)?open.delete(+id):open.add(+id); render(); }
 if(b.dataset.a==='del'&&confirm('حذف الحالة؟')){ cases=cases.filter(c=>c.id!=id); persist(); render(); }
 if(b.dataset.a==='pick') openPicker(+id);
});
$('#search').addEventListener('input',render);
$('#bNew').onclick=()=>{ const c={id:Date.now(),name:'',dt:nowStr(),teeth:[]}; cases.unshift(c); persist(); render(); };

// تغيير عرض الأعمدة بالسحب
let drag=null;
$('#tbl').addEventListener('pointerdown',e=>{ const s=e.target.closest('.rs'); if(!s) return; drag={i:+s.dataset.i,x:e.clientX,w:colW[+s.dataset.i]}; s.setPointerCapture(e.pointerId); });
addEventListener('pointermove',e=>{ if(!drag) return; colW[drag.i]=Math.max(30,drag.w-(e.clientX-drag.x)); document.querySelectorAll('#tbl col')[drag.i].style.width=colW[drag.i]+'px'; });
addEventListener('pointerup',()=>drag=null);

// تكبير/تصغير
$('#zp').onclick=()=>{zoom=Math.min(2,zoom+.1);render()};
$('#zm').onclick=()=>{zoom=Math.max(.5,zoom-.1);render()};
$('#zr').onclick=()=>{zoom=1;colW=[30,190,170,150,60,90,36];render()};

// ===== اختيار الأسنان (Palmer) =====
function chart(){
 const perm=mode==='P', nums=perm?[1,2,3,4,5,6,7,8]:['A','B','C','D','E'];
 const btn=(q,n)=>`<button class="t ${sel.has(q+n)?'on':''}" data-k="${q}${n}">${n}</button>`;
 const side=(q,rev)=>`<div class="q ${rev?'r':''}">${(rev?[...nums].reverse():nums).map(n=>btn(q,n)).join('')}</div>`;
 $('#chart').innerHTML=`<div class="lbl"><span>(UR) يمين المريض</span><span>يسار المريض (UL)</span></div>
 <div class="half up">${side('UR',1)}${side('UL',0)}</div><div class="half">${side('LR',1)}${side('LL',0)}</div>
 <div class="lbl"><span>(LR) يمين المريض</span><span>يسار المريض (LL)</span></div>`;
}
function openPicker(id){ pickId=id; sel=new Set(byId(id).teeth.map(keyOf)); mode='P'; setMode(); $('#modal').classList.add('on'); }
function setMode(){ $('#mP').classList.toggle('on',mode==='P'); $('#mD').classList.toggle('on',mode==='D'); chart(); }
$('#mP').onclick=()=>{mode='P';setMode()}; $('#mD').onclick=()=>{mode='D';setMode()};
$('#chart').addEventListener('click',e=>{ const b=e.target.closest('.t'); if(!b) return; const k=b.dataset.k; sel.has(k)?sel.delete(k):sel.add(k); b.classList.toggle('on'); });
$('#mClr').onclick=()=>{sel.clear();chart()};
$('#mDone').onclick=()=>{
 const c=byId(pickId), old=new Map(c.teeth.map(t=>[keyOf(t),t]));
 c.teeth=[...sel].map(k=>old.get(k)||{q:k.slice(0,2),n:k.slice(2),proc:DEF,stage:PROCS[DEF][0],price:0});
 open.add(c.id); persist(); $('#modal').classList.remove('on'); render();
};
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); });

// ===== Excel =====
$('#bXls').onclick=()=>{
 const rows=[['اسم الحالة','تاريخ ووقت التسجيل','السن (Palmer)','الإجراء','المرحلة','السعر (ج.م)']];
 cases.forEach(c=>{ if(!c.teeth.length) rows.push([c.name,fmt(c.dt),'','','','']); c.teeth.forEach(t=>rows.push([c.name,fmt(c.dt),lblOf(t),t.proc,t.stage,t.price||0])); });
 const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Dentalea');
 XLSX.writeFile(wb,`Dentalea-${nowStr().slice(0,10)}.xlsx`);
};

// ===== استيراد / حفظ محلي =====
$('#bImp').onclick=async()=>{
 if(token && confirm('استيراد من Google Drive؟ (إلغاء = اختيار ملف من الجهاز)')) return loadDrive();
 $('#file').click();
};
$('#file').onchange=async e=>{ const f=e.target.files[0]; if(f) merge(JSON.parse(await f.text())); e.target.value=''; };
function merge(arr){ if(!Array.isArray(arr)) return alert('الملف غير صالح'); const ids=new Set(cases.map(c=>c.id)); arr.forEach(c=>{ if(!ids.has(c.id)) cases.push(c); }); persist(); render(); say(`تم استيراد ${arr.length} حالة`); }
$('#bSave').onclick=async()=>{
 if(token) return saveDrive();
 const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(cases)],{type:'application/json'})); a.download=FILE_NAME; a.click();
};

// ===== Google Drive =====
let token=null, tc;
const say = m => $('#status').textContent = m;
$('#drv').onclick=()=>{
 if(!CLIENT_ID) return alert('لتفعيل Drive: أنشئ OAuth Client ID من Google Cloud وضعه في CLIENT_ID أعلى ملف index.html. لحد وقتها الحفظ محلي + ملف JSON.');
 tc=tc||google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email',callback:async r=>{
  token=r.access_token; try{ const u=await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+token}})).json(); say('✓ متصل: '+u.email);}catch{say('✓ متصل');} }});
 tc.requestAccessToken();
};
const H = () => ({Authorization:'Bearer '+token});
async function findFile(){ const r=await (await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`name='${FILE_NAME}' and trashed=false`)}&fields=files(id)`,{headers:H()})).json(); return r.files?.[0]?.id; }
async function saveDrive(){
 try{
  const id=await findFile(), meta={name:FILE_NAME,mimeType:'application/json'}, b='dlea';
  const body=`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(id?{}:meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(cases)}\r\n--${b}--`;
  const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files${id?'/'+id:''}?uploadType=multipart`,{method:id?'PATCH':'POST',headers:{...H(),'Content-Type':'multipart/related; boundary='+b},body});
  say(r.ok?'✓ تم الحفظ على Drive':'تعذر الحفظ على Drive');
 }catch{ say('تعذر الاتصال بـ Drive'); }
}
async function loadDrive(){
 try{ const id=await findFile(); if(!id) return say('مفيش نسخة محفوظة على Drive'); merge(await (await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:H()})).json()); }
 catch{ say('تعذر الاستيراد من Drive'); }
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
